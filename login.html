<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><meta name="robots" content="noindex,nofollow">
<title>Entrar • RUMR</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<header class="top"><a class="brand" href="index.html"><span class="seal">R</span><span><b>REPÚBLICA UNIDA</b><small>DE MONTE REAL</small></span></a><a class="back" href="index.html">← Voltar ao portal</a></header>
<main class="auth-wrap">
  <section class="auth-card">
    <p class="eyebrow">ÁREA DE PARTICIPAÇÃO</p>
    <h1>Acessar <em>conta</em></h1>
    <p class="auth-intro">Entre com o e-mail e a senha cadastrados na plataforma.</p>
    <form id="loginForm">
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></div>
      <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></div>
      <button class="admin-btn auth-submit" type="submit">Entrar</button>
      <button class="admin-btn secondary auth-submit" id="resendVerification" type="button">Reenviar verificação de e-mail</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </form>
    <p class="auth-switch">Ainda não possui conta? <a href="cadastro.html">Criar cadastro</a></p>
  </section>
</main>
<footer><div class="footer-brand"><span class="seal small">R</span><b>REPÚBLICA UNIDA DE MONTE REAL</b></div><p>Portal institucional de uma comunidade fictícia e voluntária.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<script src="auth.js?v=2"></script>
<script>
  // Diagnóstico temporário: impede o recarregamento nativo e confirma
  // se o navegador está detectando o envio do formulário.
  (() => {
    const form = document.getElementById("loginForm");
    const message = document.getElementById("authMessage");
    if (!form || !message) return;
    form.addEventListener("submit", () => {
      message.textContent = "Envio detectado. Verificando o funcionamento do login…";
      message.dataset.type = "info";
    }, true);
  })();
</script>
</body></html>
